# This is a basic workflow to help you get started with Actions

name: CI

# Controls when the workflow will run
on:
  # Triggers the workflow on push or pull request events but only for the "main" branch
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  # This workflow contains a single job called "build"
  build:
    # The type of runner that the job will run on
    runs-on: ubuntu-latest
    permissions: 
      id-token: write
      contents: read

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - uses: actions/checkout@v4

      # Runs a single command using the runners shell
      - name: Run a one-line script
        run: echo Hello, world!

      - name: Print OIDC Token Payload (DEBUG)
        uses: actions/github-script@v6
        with:
          script: |
            const token = await core.getIDToken('sts.aliyuncs.com');
            const payload = token.split('.')[1];
            const decoded = Buffer.from(payload, 'base64').toString('utf-8');
            console.log("GitHub 发送给阿里云的真实凭证内容：");
            console.log(JSON.parse(decoded));
      
      - name: "Setup Aliyun CLI" 
        uses: aliyun/configure-aliyun-credentials-action@v1.0.7
        with:
          role-session-name: GitHubActionsDeploy
          oidc-provider-arn: acs:ram::1213354879732834:oidc-provider/github-actions-oidc
          role-to-assume: acs:ram::1213354879732834:role/github-deploy-role
          audience: sts.aliyuncs.com
      - name: Install Aliyun CLI
        uses: aliyun/setup-aliyun-cli-action@v1
        with:
          version: 'latest'
          
      - name: Print STS Token Details (DEBUG ONLY)
        env:
          ALIBABA_CLOUD_REGION_ID: cn-hangzhou 
        run: |
          echo "=== 阿里云 STS 临时凭证开始 ==="
          echo "AccessKeyId: $ALIBABA_CLOUD_ACCESS_KEY_ID"
          
          # 验证当前身份
          echo "验证当前身份信息："
          aliyun sts GetCallerIdentity
